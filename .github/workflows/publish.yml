name: Publish a release

# Installers are pushed to a branch named incoming/v<version> together with NOTES.md.
# This makes the GitHub release (the apps' updater reads "latest"), attaches the installers and
# SHA256SUMS.txt, then deletes the incoming branch so the installers don't stay in the code history.
on:
  push:
    branches: ["incoming/**"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME#incoming/}"
          cd incoming
          ls -la
          sha256sum *-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes=NOTES.md; [ -f "$notes" ] || echo "Werks $tag" > "$notes"
          gh release create "$tag" *-Setup-*.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --target main --title "Werks ${tag#v}" --notes-file "$notes" --latest

      - name: Remove the incoming branch
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME" || true
